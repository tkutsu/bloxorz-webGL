<!DOCTYPE html>
<html lang="en-US">
<head>
	<title>Bloxorz in webGL</title>
	<meta charset="UTF-8">
	<meta name="author" content="Koutsouris Themistokles">
	<meta name="keywords" content="bloxorz, project, webGL, Graphics, TUC, 2013, Koutsouris, Themos">
	<link rel="icon" type="image/x-icon" href="favicon.ico"/>
	<link rel="stylesheet" href="project.css" media="all" type="text/css"/>
	<script src="glMatrix-0.9.5.min.js" type="text/javascript"></script>
	<script src="webgl-utils.js" type="text/javascript"></script>
	<script src="projectAssets.js" type="text/javascript"></script>	<!--contains assets in base 64 format-->
	<script src="project.js" type="text/javascript"></script>
	
	<script id="vShader" type="x-shader/x-vertex">//code for vertex shader
    	attribute vec3 aVertexPosition;//attributes for the vertex shader (different for every thread/core that will execute a copy of this)
    	attribute vec4 aVertexColor;
		attribute vec2 aTextureCoord;
		//attribute vec3 aVertexNormal;
		
		//uniform mat4 uNormalMatrix;
    	uniform mat4 uMVMatrix;//ModelView and Projection Matrices
    	uniform mat4 uPMatrix;
		
    	varying vec4 vColor;//Variables to be forwarded to the corresponding thread of the fragment shader
		varying vec2 vTextureCoord;
		//varying vec3 vLighting;
		
		void main(void) {//this code will be copied to many shader cores/threads and executed with the associated data for every vertex (matrices, color, etc)
			
			gl_Position = uPMatrix * uMVMatrix * vec4(aVertexPosition, 1.0);//Each vertex multiplied with ModelView and Projection matrices,creating a fragment
        	vColor = aVertexColor;//Its color is forwarded to the fragment shader
			vTextureCoord = aTextureCoord;//Its texture coords are forwarded to the fragment shader

			//vec3 ambientLight = vec3(0.7, 0.7, 0.7);//ambient light color
			//vec3 directionalLightColor = vec3(0.3, 1.0, 0.5);//directional light color
			//vec3 directionalVector = vec3(0.85, 0.8, 0.75);//direction that light is coming from
			//vec4 transformedNormal = uNormalMatrix * vec4(aVertexNormal, 1.0);
			//float directional = max(dot(transformedNormal.xyz, directionalVector), 0.0);
			//vLighting = ambientLight + (directionalLightColor * directional);
    	}
	</script>
	
	<script id="fShader" type="x-shader/x-fragment">//Code for fragment shader
		precision mediump float;//necessary code for compatibility
	    varying vec4 vColor;//Variable coming from the vertex shader
		varying vec2 vTextureCoord;//Variable coming from the vertex shader
		//varying vec3 vLighting;
		
		uniform sampler2D uSampler;
		
    	void main(void) {
			gl_FragColor = texture2D(uSampler, vTextureCoord)*vColor;
			//vec4 texelColor = texture2D(uSampler, vTextureCoord)*vColor;//computed by fetching the texel (texture pixel) that sampler corresponds to fragment's position
			//gl_FragColor = vec4(texelColor.rgb*vLighting, texelColor.a);//computing fragment color after lighting
	    }
	</script>
	
</head>
<body onload="loadAsset();pageUI();">
	<canvas id="c">Canvas element is not supported. Consider updating browser.</canvas>
	<img id="glass" src="">
	<div id="promptPlay" class="prompt textshading">NEW GAME!</div>
	<div id="promptLose" class="prompt textshading">TRY AGAIN!</div>
	<div id="promptCont" class="prompt textshading">CONTINUE!</div>
	<div id="promptTop" class="scorePrompt textshading">TOP SCORE!</div>
	<div id="promptTime" class="scorePrompt textshading">FAST! +1</div>
	<div id="help" class="textshadingLight">
		<ul id="helpList">
			<li>Enter or Space : Play</li>
			<li>Arrows or WASD : Move</li>
			<li>Click & drag : Camera</li>
			<li>Escape : Pause</li>
			<li>0 to 9 : Volume</li>
			<li>Q : Change quality</li>
		</ul>
	</div>
	<div id="score" class="textshading"></div>
	<div id="popup" class="textshadingLight"></div>
</body>
</html>
